name: Student template
on:
  push:
    branches: [codex/hit-student-template]
  pull_request:
    branches: [codex/hit-student-template]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PDF tool regression
        run: |
          python -m pip install -r scripts/requirements-pdf.txt
          python scripts/test_remove_pdf_page_links.py -v
      - name: TeX and BibTeX regression with official runtime
        run: |
          docker pull texlive/texlive:latest
          docker run --rm -v "$PWD:/hithesis" -w /hithesis texlive/texlive:latest bash -c 'apt-get update && apt-get install -y python3-pip poppler-utils && bash scripts/prepare-student.sh && python3 -m pip install --break-system-packages -r scripts/requirements-pdf.txt && python3 tests/student-tools/test_bst.py -v && python3 tests/validate_student.py'
